<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--=============== FAVICON ===============-->
    <link rel="icon" href="public/images/BanglaBornomala logo.png" type="image/x-icon">

    <!--=============== REMIXICONS ===============-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">

    <!--=============== GOOGLE ICON ===============-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!--=============== SWIPER CSS ===============-->
    <link rel="stylesheet" href="swiper-bundle.min.css">

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="bornobondhu.css">

    <title>বর্ণবট | বর্ণঘর - এসো শিখি বর্ণমালা</title>
</head>
<body>
    <!--==================== HEADER ====================-->
    <header class="header" id="header">
        <nav class="nav container">
            <div class="nav__logo">
                <a href="index.html">
                    <img src="public/images/logo.svg" alt="Bangla Borno Logo" class="logo-image">
                    <span>বর্ণঘর</span>
                </a>
            </div>

            <div class="nav__menu">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="index.html" class="nav__link">
                            <i class="ri-home-line"></i>
                            <span>হোম</span>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="bornoboi.html" class="nav__link">
                            <i class="ri-book-3-line"></i>
                            <span>বর্ণবই</span>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="bornobhasha.html" class="nav__link">
                            <i class="ri-translate-2"></i>
                            <span>বর্ণভাষা</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="nav__actions">
                <i class="ri-search-line search-button" id="search-button"></i>
                <i class="ri-moon-line change-theme" id="theme-button"></i>
            </div>
        </nav>
    </header>

    <!--==================== SEARCH ====================-->
    <div class="search" id="search-content">
        <form action="" class="search__form">
            <i class="ri-search-line search__icon"></i>
            <input type="search" placeholder="কী খুঁজছেন?" class="search__input">
        </form>
        <i class="ri-close-line search__close" id="search-close"></i>
    </div>

    <!--==================== MAIN ====================-->
    <main class="main">
        <div class="chat__container">
            <div class="app-header">
                <h1 class="heading">আসসালামু আলাইকুম!</h1> 
                <h2 class="sub-heading">কীভাবে সাহায্য করতে পারি?</h2> 
            </div>

            <!-- Chats Display Area -->
            <div id="chatOutput" class="chats-container"></div>

            <!-- Prompt Container -->
            <div class="prompt-container">
                <div class="prompt-wrapper">
                    <form class="prompt-form" onsubmit="return false;">
                        <input type="text" id="userInput" placeholder="প্রশ্ন করুন।" class="prompt-input" required>
                        <div class="prompt-actions">
                            <button id="send-prompt-btn" type="button" class="material-symbols-rounded">arrow_upward</button>
                        </div>
                    </form>
                    
                    <button id="theme-toggle-btn" type="button" class="material-symbols-rounded">light_mode</button> 
                    <button id="delete-chats-btn" type="button" class="material-symbols-rounded">delete</button>
                </div>
            </div>
        </div>
    </main>

    <!--==================== FOOTER ====================-->
    <footer class="footer">
        <span class="footer__copy">&copy; বর্ণঘরের সকল স্বত্ব সংরক্ষিত।</span>
    </footer>

    <!--=============== SWIPER JS ===============-->
    <script src="js/swiper-bundle.min.js"></script>

    <!--=============== MAIN JS ===============-->
    <script src="js/script.js"></script>
</body>
</html>
